
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gestao-producao-app
    volumes:
      - ..:/var/www/html
    working_dir: /var/www/html
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-gestao_producao}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    container_name: gestao-producao-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gestao_producao}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  node:
    image: node:20-alpine
    container_name: gestao-producao-node
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    command: sleep infinity
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
